<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Try Out 4 — TKA Kimia SMA Negeri 2 Tahun 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    :root {
        --bg: #0b1a17;
        --bg2: #132a24;
        --card: #1a3a32;
        --card2: #1e4a3f;
        --text: #e8f0ec;
        --muted: #8aa8a0;
        --border: #2a4a42;
        --accent: #d4a04a;
        --success: #34d399;
        --error: #f87171;
        --glow: rgba(212, 160, 74, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Source Sans 3', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding-top: 52px;
    }

    .fd { font-family: 'Playfair Display', serif; }

    .bg-noise {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
    }

    .hg {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.15;
        pointer-events: none;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        border-radius: 100px;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(212, 160, 74, 0.12);
        color: var(--accent);
    }

    .view { display: none; animation: fadeUp 0.35s ease; }
    .view.active { display: block; }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .ob {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg2);
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.9rem;
        text-align: left;
    }
    .ob:hover { border-color: var(--muted); }
    .ob.sel { border-color: var(--accent); background: rgba(212, 160, 74, 0.1); }
    .ob .ck {
        width: 20px;
        height: 20px;
        min-width: 20px;
        border-radius: 4px;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        background: var(--bg);
    }
    .ob.sel .ck { border-color: var(--accent); background: var(--accent); }
    .ob.ok { border-color: var(--success); background: rgba(52,211,153,0.1); }
    .ob.no { border-color: var(--error); background: rgba(248,113,113,0.1); }
    .ob.off { pointer-events: none; opacity: 0.8; }

    .bp {
        background: var(--accent);
        color: #0b1a17;
        border: none;
        padding: 8px 18px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .bp:hover { background: #e8b84a; transform: scale(1.02); }
    .bp:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .bs {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 18px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .bs:hover { border-color: var(--accent); background: var(--card2); }

    .stim {
        background: var(--bg2);
        padding: 12px 16px;
        border-radius: 8px;
        border-left: 3px solid var(--accent);
        margin-bottom: 12px;
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted);
    }

    .table-wrap {
        overflow-x: auto;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid var(--border);
    }
    table.soal-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
        background: var(--bg2);
    }
    table.soal-table th {
        background: var(--card);
        color: var(--accent);
        font-weight: 600;
        padding: 6px 10px;
        border: 1px solid var(--border);
        text-align: center;
    }
    table.soal-table td {
        padding: 6px 10px;
        border: 1px solid var(--border);
        text-align: center;
        color: var(--text);
    }
    table.soal-table tr:hover { background: rgba(212, 160, 74, 0.05); }

    .figure-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 8px 0;
        padding: 10px;
        background: var(--bg2);
        border-radius: 8px;
        border: 1px solid var(--border);
    }
    .figure-wrap svg { max-width: 100%; height: auto; }
    .figure-caption {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 4px;
        text-align: center;
    }

    .expbox {
        margin-top: 14px;
        padding: 14px 18px;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.7;
    }
    .expbox.good {
        background: rgba(52, 211, 153, 0.06);
        border-left: 4px solid var(--success);
    }
    .expbox.bad {
        background: rgba(248, 113, 113, 0.06);
        border-left: 4px solid var(--error);
    }

    .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 50;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .modal-bg.open { display: flex; }

    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: 600;
        z-index: 100;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        max-width: 90%;
        text-align: center;
        display: none;
    }

    .timer {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
    }
    .timer.warning { color: var(--error); }

    .level-badge {
        display: inline-block;
        padding: 2px 12px;
        border-radius: 100px;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-right: 6px;
    }
    .level-badge.c4 { background: #f97316; color: #0b1a17; }
    .level-badge.c5 { background: #ef4444; color: #fff; }
    .level-badge.c6 { background: #8b5cf6; color: #fff; }

    .soal-num {
        display: inline-block;
        width: 28px;
        height: 28px;
        line-height: 28px;
        text-align: center;
        border-radius: 50%;
        font-size: 0.7rem;
        font-weight: 700;
        background: var(--bg2);
        color: var(--muted);
        flex-shrink: 0;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid var(--border);
    }
    .soal-num:hover { border-color: var(--accent); }
    .soal-num.done {
        background: rgba(52, 211, 153, 0.15);
        color: var(--success);
        border-color: var(--success);
    }
    .soal-num.wrong {
        background: rgba(248, 113, 113, 0.15);
        color: var(--error);
        border-color: var(--error);
    }
    .soal-num.active {
        background: var(--accent);
        color: #0b1a17;
        border-color: var(--accent);
        transform: scale(1.1);
    }

    .chem-eq {
        display: block;
        text-align: center;
        padding: 0.5rem 0.75rem;
        font-family: "Times New Roman", serif;
        font-size: 1rem;
        background: var(--bg2);
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        margin: 0.5rem 0;
        color: var(--text);
    }
    .chem-eq sub { font-size: 0.7em; vertical-align: sub; }
    .chem-eq sup { font-size: 0.7em; vertical-align: super; }
    .chem-eq .arrow { color: var(--accent); margin: 0 0.3rem; }

    /* Glow card untuk daftar soal */
    .glow-card {
        transition: all 0.25s;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 12px;
        padding: 16px 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .glow-card:hover {
        border-color: var(--accent);
        box-shadow: 0 0 24px var(--glow);
        transform: translateY(-2px);
    }

    @media (max-width: 640px) {
        .ob { font-size: 0.8rem; padding: 6px 12px; }
        .bp, .bs { font-size: 0.75rem; padding: 6px 14px; }
        .timer { font-size: 1rem; }
        .soal-num { width: 24px; height: 24px; line-height: 24px; font-size: 0.6rem; }
        .stim { font-size: 0.82rem; padding: 10px 14px; }
        table.soal-table { font-size: 0.65rem; }
        table.soal-table th, table.soal-table td { padding: 4px 6px; }
    }
</style>
</head>
<body>
<div class="bg-noise"></div>

<!-- NAV -->
<nav class="fixed top-0 left-0 right-0 z-40 backdrop-blur-md border-b" style="background:rgba(11,26,23,0.92);border-color:var(--border)">
<div class="max-w-5xl mx-auto px-4 flex items-center justify-between" style="height:52px">
<button onclick="location.href='index.html'" class="flex items-center gap-2 text-sm font-bold tracking-wide" style="color:var(--accent);background:none;border:none;cursor:pointer;">
<i class="fa-solid fa-arrow-left"></i><span class="hidden sm:inline">Kembali</span>
</button>
<div class="flex items-center gap-3">
<span class="text-xs" style="color:var(--muted)"><i class="fa-regular fa-clock"></i> <span id="timerDisplay" class="timer">90:00</span></span>
<button onclick="location.href='index.html'" class="text-sm px-2.5 py-1 rounded" style="color:var(--muted);background:none;border:none;cursor:pointer;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">
<i class="fa-solid fa-house"></i>
</button>
</div>
</div>
</nav>

<!-- ============================================================ -->
<!-- HOME -->
<!-- ============================================================ -->
<div id="vHome" class="view active pt-16 pb-12 px-4">
<div class="max-w-4xl mx-auto">
    <div class="relative rounded-2xl overflow-hidden mb-8 p-7 md:p-10" style="background:linear-gradient(135deg,var(--card),var(--card2))">
        <div class="hg" style="background:var(--accent);top:-180px;right:-80px"></div>
        <div class="hg" style="background:#34d399;bottom:-180px;left:-80px"></div>
        <div class="relative z-10">
            <div class="badge mb-3"><i class="fa-solid fa-star"></i> Try Out 4</div>
            <h1 class="fd text-3xl md:text-4xl font-black mb-2 leading-tight">Try Out <span style="color:var(--accent)">TKA Kimia 2026</span></h1>
            <p class="text-sm md:text-base max-w-lg" style="color:var(--muted);line-height:1.65">
                30 soal HOTS level C4-C6 dengan narasi kontekstual aktual. Waktu pengerjaan 90 menit.
            </p>
            <div class="flex flex-wrap gap-3 mt-4">
                <span class="text-xs px-3 py-1 rounded-full" style="background:rgba(249,115,22,0.15);color:#f97316;">
                    <i class="fa-regular fa-star"></i> C4 - Mengevaluasi
                </span>
                <span class="text-xs px-3 py-1 rounded-full" style="background:rgba(239,68,68,0.15);color:#ef4444;">
                    <i class="fa-regular fa-star"></i> C5 - Mencipta
                </span>
                <span class="text-xs px-3 py-1 rounded-full" style="background:rgba(139,92,246,0.15);color:#8b5cf6;">
                    <i class="fa-regular fa-star"></i> C6 - Menilai
                </span>
                <span class="text-xs px-3 py-1 rounded-full" style="background:rgba(52,211,153,0.12);color:#34d399;">
                    <i class="fa-regular fa-clock"></i> 90 Menit
                </span>
            </div>
        </div>
    </div>

    <div class="flex flex-wrap gap-2.5 mb-7">
        <button onclick="startTryOut()" class="bp"><i class="fa-solid fa-play"></i> Mulai Try Out</button>
        <button onclick="resetAll()" class="bs"><i class="fa-solid fa-trash-can"></i> Reset</button>
    </div>

    <div id="qList"></div>
</div>
</div>

<!-- ============================================================ -->
<!-- QUIZ -->
<!-- ============================================================ -->
<div id="vQuiz" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <button onclick="openExit()" class="text-sm flex items-center gap-1.5" style="color:var(--muted);background:none;border:none;cursor:pointer;" onmouseover="this.style.color='var(--error)'" onmouseout="this.style.color='var(--muted)'">
            <i class="fa-solid fa-xmark"></i>Keluar
        </button>
        <div class="flex items-center gap-2.5">
            <span id="qCtr" class="text-sm font-semibold" style="color:var(--muted)"></span>
            <span id="qLevel" class="badge" style="background:var(--bg2);color:var(--muted);font-size:0.7rem;"></span>
        </div>
    </div>
    <div class="w-full h-1.5 rounded-full mb-5" style="background:var(--border)">
        <div id="qBar" class="h-full rounded-full transition-all duration-400" style="background:var(--accent);width:0%"></div>
    </div>
    
    <!-- Navigator Soal -->
    <div class="flex flex-wrap gap-1.5 mb-4" id="soalNav"></div>
    
    <div id="qArea"></div>
    <div class="flex items-center justify-between mt-7">
        <button id="bPrv" onclick="qPrev()" class="bs" style="visibility:hidden"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
        <button id="bNxt" onclick="qNext()" class="bp">Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i></button>
    </div>
</div>
</div>

<!-- ============================================================ -->
<!-- RESULTS -->
<!-- ============================================================ -->
<div id="vRes" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto text-center">
    <div class="mb-7">
        <svg class="mx-auto mb-3" style="transform:rotate(-90deg)" width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="55" fill="none" stroke="var(--border)" stroke-width="7"/>
            <circle id="rRing" cx="65" cy="65" r="55" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="345.6"/>
        </svg>
        <div class="text-3xl font-bold" style="color:var(--accent)" id="rPct">0%</div>
        <div class="text-sm mt-0.5" style="color:var(--muted)" id="rLbl">—</div>
        <div class="text-xs mt-1" style="color:var(--muted)" id="rTime">Waktu: 00:00</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mb-7">
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" style="color:var(--success)" id="rOk">0</div>
            <div class="text-xs" style="color:var(--muted)">Benar</div>
        </div>
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" style="color:var(--error)" id="rNo">0</div>
            <div class="text-xs" style="color:var(--muted)">Salah</div>
        </div>
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" id="rTot">0</div>
            <div class="text-xs" style="color:var(--muted)">Total</div>
        </div>
    </div>
    <div class="flex flex-wrap justify-center gap-2.5">
        <button onclick="location.href='index.html'" class="bs"><i class="fa-solid fa-house mr-1"></i>Beranda</button>
        <button onclick="reviewWrong()" class="bp" id="bRW" style="display:none"><i class="fa-solid fa-eye mr-1"></i>Review Salah</button>
        <button onclick="retryTO()" class="bs"><i class="fa-solid fa-rotate-left mr-1"></i>Ulangi</button>
    </div>
</div>
</div>

<!-- ============================================================ -->
<!-- REVIEW -->
<!-- ============================================================ -->
<div id="vRev" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
    <button onclick="backRev()" class="flex items-center gap-2 text-sm mb-5" style="color:var(--muted);background:none;border:none;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i>Kembali</button>
    <div id="revA"></div>
    <div class="flex justify-center gap-2.5 mt-7">
        <button id="rvPr" onclick="rvNav(-1)" class="bs"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
        <button id="rvNx" onclick="rvNav(1)" class="bp">Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i></button>
    </div>
</div>
</div>

<!-- EXIT MODAL -->
<div id="exMod" class="modal-bg">
    <div class="rounded-xl p-5 max-w-sm w-full" style="background:var(--card);border:1px solid var(--border)">
        <h3 class="fd text-lg font-bold mb-1.5">Keluar dari Try Out?</h3>
        <p class="text-sm mb-4" style="color:var(--muted)">Progress akan hilang. Waktu akan berhenti.</p>
        <div class="flex gap-2.5 justify-end">
            <button onclick="closeMod()" class="bs text-sm">Batal</button>
            <button onclick="doExit()" class="text-sm font-bold px-4 py-2 rounded-lg border-none cursor-pointer" style="background:var(--error);color:#fff">Keluar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ================================================================
// DATA SOAL TRY OUT 4 - HOTS C4-C6 (30 Soal)
// ================================================================
var QS = [];

// ================================================================
// KIMIA FISIKA - C4 (Soal 1-5)
// ================================================================

// Soal 1: Energi aktivasi - Katalis Konverter Knalpot
QS.push({
  id: 1,
  level: "c4",
  type: "single",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Konverter katalitik pada kendaraan bermotor menggunakan logam platina (Pt) dan paladium (Pd) untuk mengubah gas beracun CO dan NO menjadi CO₂ dan N₂.</strong>
    </div>
    <div class="chem-eq">
      2CO(g) + 2NO(g) → 2CO₂(g) + N₂(g) &nbsp; ΔH = -746 kJ/mol
    </div>
    <div style="font-size:0.85rem;color:var(--muted);margin-top:0.5rem;">
      <i class="fa-solid fa-info-circle"></i> Tanpa katalis, energi aktivasi 360 kJ/mol. Dengan katalis Pt, energi aktivasi turun menjadi 85 kJ/mol.
    </div>
  `,
  q: "Berdasarkan data tersebut, pernyataan yang PALING TEPAT tentang pengaruh katalis terhadap laju reaksi adalah...",
  opts: [
    "Katalis menurunkan ΔH reaksi sehingga reaksi menjadi lebih spontan",
    "Katalis menurunkan energi aktivasi sehingga mempercepat laju reaksi",
    "Katalis meningkatkan suhu reaksi sehingga reaksi berlangsung lebih cepat",
    "Katalis mengubah kesetimbangan reaksi ke arah produk",
    "Katalis meningkatkan konsentrasi reaktan sehingga tumbukan lebih sering terjadi"
  ],
  ans: 1,
  exp: "Katalis bekerja dengan menurunkan energi aktivasi (Ea), sehingga lebih banyak molekul yang memiliki energi cukup untuk bereaksi. Katalis tidak mengubah ΔH, kesetimbangan, atau konsentrasi reaktan."
});

// Soal 2: Orde reaksi - Degradasi Obat
QS.push({
  id: 2,
  level: "c4",
  type: "single",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Sebuah perusahaan farmasi menguji stabilitas obat baru. Data konsentrasi obat terhadap waktu pada suhu 37°C:</strong>
    </div>
    <div class="table-wrap">
      <table class="soal-table">
        <tr><th>Waktu (jam)</th><th>[Obat] (M)</th></tr>
        <tr><td>0</td><td>0,500</td></tr>
        <tr><td>2</td><td>0,354</td></tr>
        <tr><td>4</td><td>0,250</td></tr>
        <tr><td>6</td><td>0,177</td></tr>
        <tr><td>8</td><td>0,125</td></tr>
      </table>
    </div>
  `,
  q: "Orde reaksi degradasi obat tersebut dan nilai tetapan laju (k) adalah...",
  opts: [
    "Orde 0, k = 0,047 M/jam",
    "Orde 1, k = 0,173 jam⁻¹",
    "Orde 1, k = 0,347 jam⁻¹",
    "Orde 2, k = 0,173 M⁻¹jam⁻¹",
    "Orde 2, k = 0,347 M⁻¹jam⁻¹"
  ],
  ans: 2,
  exp: "Cek orde 1: ln[A] vs t linier. t½ = 2 jam (dari 0,5→0,25 dalam 4 jam? Periksa: 0,5→0,25 membutuhkan 4 jam = 2 waktu paruh, t½=2 jam). k = ln2/2 = 0,347 jam⁻¹."
});

// Soal 3: Kesetimbangan - Emisi CO2
QS.push({
  id: 3,
  level: "c4",
  type: "single",

// ================================================================
// STATE MANAGEMENT
// ================================================================
var S = {
  view: "home",
  qids: [],
  qi: 0,
  ans: {},
  mode: "tryout",
  ri: 0,
  rqs: [],
  wrong: [],
  done: {},
  scores: {},
  timer: null,
  timeLeft: 5400, // 90 menit dalam detik
  isFinished: false,
  totalSoal: 30,
  isAnswered: {}
};

// ================================================================
// FUNGSI TIMER
// ================================================================
function startTimer() {
    if (S.timer) return;
    S.timer = setInterval(function() {
        S.timeLeft--;
        updateTimerDisplay();
        if (S.timeLeft <= 0) {
            clearInterval(S.timer);
            S.timer = null;
            finishTryOut();
            toast("⏰ Waktu habis! Try Out selesai.", "var(--error)");
        }
    }, 1000);
}

function updateTimerDisplay() {
    var minutes = Math.floor(S.timeLeft / 60);
    var seconds = S.timeLeft % 60;
    var display = document.getElementById("timerDisplay");
    display.textContent = String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
    if (S.timeLeft < 300) { // 5 menit tersisa
        display.classList.add("warning");
    } else {
        display.classList.remove("warning");
    }
}

function getTimeSpent() {
    var spent = 5400 - S.timeLeft;
    var minutes = Math.floor(spent / 60);
    var seconds = spent % 60;
    return String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
}

// ================================================================
// FUNGSI UTAMA
// ================================================================
function startTryOut() {
    S.qids = QS.map(function(q) { return q.id; });
    S.ans = {};
    S.qi = 0;
    S.wrong = [];
    S.done = {};
    S.isFinished = false;
    S.timeLeft = 5400;
    S.mode = "tryout";
    S.isAnswered = {};
    updateTimerDisplay();
    document.getElementById("timerDisplay").classList.remove("warning");
    go("quiz");
    renderQ();
    startTimer();
}

function go(v) {
    var names = {home:"vHome", quiz:"vQuiz", res:"vRes", rev:"vRev"};
    document.querySelectorAll(".view").forEach(function(el) { el.classList.remove("active"); });
    var el = document.getElementById(names[v]);
    if (el) el.classList.add("active");
    S.view = v;
    window.scrollTo(0, 0);
    if (v === "home") renderHome();
}

function renderHome() {
    document.getElementById("bRW").style.display = S.wrong.length > 0 ? "flex" : "none";
    renderList();
}

function renderList() {
    var list = document.getElementById("qList");
    list.innerHTML = "";
    QS.forEach(function(q, i) {
        var answered = S.done[q.id];
        var wasWrong = S.wrong.indexOf(q.id) >= 0;
        var levelLabel = getLevelBadge(q.level);

        var d = document.createElement("div");
        d.className = "glow-card rounded-lg p-3.5 mb-2.5 cursor-pointer flex items-center gap-3";
        d.style.background = "var(--card)";
        d.onclick = function() { singleQ(q.id); };
        d.innerHTML =
            '<div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0" style="background:' +
            (answered ? (wasWrong ? 'rgba(248,113,113,.12);color:var(--error)' : 'rgba(52,211,153,.12);color:var(--success)') : 'var(--bg2);color:var(--muted)') +
            '">' + (answered ? (wasWrong ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-check"></i>') : (i + 1)) + '</div>' +
            '<div class="flex-1 min-w-0">' +
            '<div class="text-sm font-semibold mb-0.5 truncate" style="color:var(--text)">' + plain(q.q).substring(0, 80) + (q.q.length > 80 ? '...' : '') + '</div>' +
            '<div class="flex items-center gap-2 flex-wrap">' +
            '<span class="badge" style="background:var(--bg2);color:var(--muted);font-size:.68rem;">' + (q.type === "mcma" ? "MCMA" : "PG") + '</span>' +
            levelLabel +
            '</div>' +
            '</div>' +
            '<i class="fa-solid fa-chevron-right text-xs" style="color:var(--border)"></i>';
        list.appendChild(d);
    });
}

function getLevelBadge(level) {
    var labels = {c4:"C4", c5:"C5", c6:"C6"};
    var colors = {c4:"#f97316", c5:"#ef4444", c6:"#8b5cf6"};
    var bgColors = {c4:"rgba(249,115,22,0.15)", c5:"rgba(239,68,68,0.15)", c6:"rgba(139,92,246,0.15)"};
    return '<span class="badge" style="background:' + bgColors[level] + ';color:' + colors[level] + ';font-size:0.65rem;">' + labels[level] + '</span>';
}

function plain(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    return d.textContent || "";
}

function singleQ(qid) {
    S.qids = [qid];
    S.ans = {};
    S.qi = 0;
    S.mode = "single";
    go("quiz");
    renderQ();
}

function renderQ() {
    var qid = S.qids[S.qi];
    var q = QS.find(function(x) { return x.id === qid; });
    if (!q) return;
    var total = S.qids.length;
    var idx = S.qi + 1;
    var pct = Math.round(idx / total * 100);

    document.getElementById("qCtr").textContent = idx + " / " + total;
    document.getElementById("qBar").style.width = pct + "%";
    var levelLabels = {c4:"C4 - Mengevaluasi", c5:"C5 - Mencipta", c6:"C6 - Menilai"};
    document.getElementById("qLevel").textContent = q.level ? levelLabels[q.level] : "";
    document.getElementById("bPrv").style.visibility = S.qi > 0 ? "visible" : "hidden";
    var isLast = S.qi === total - 1;
    document.getElementById("bNxt").innerHTML = isLast ? "Selesai <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

    // Navigasi Soal
    var nav = document.getElementById("soalNav");
    nav.innerHTML = "";
    S.qids.forEach(function(id, i) {
        var span = document.createElement("span");
        span.className = "soal-num";
        if (S.done[id]) {
            if (S.wrong.indexOf(id) >= 0) span.classList.add("wrong");
            else span.classList.add("done");
        }
        if (i === S.qi) span.classList.add("active");
        span.textContent = i + 1;
        span.onclick = function() { goToSoal(i); };
        nav.appendChild(span);
    });

    var h = "";
    if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
    h += '<h3 class="font-bold text-base mb-4 leading-relaxed" style="color:var(--text)">' + q.q + '</h3>';

    var letters = "ABCDE";
    h += '<div class="space-y-2.5">';
    q.opts.forEach(function(opt, i) {
        var sel = S.ans[qid] === i;
        h += '<button class="ob' + (sel ? ' sel' : '') + '" onclick="selS(' + qid + ',' + i + ')">' +
            '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:' + (sel ? 'var(--accent)' : 'var(--border)') + ';color:' + (sel ? 'var(--accent)' : 'var(--muted)') + '">' + letters[i] + '</span>' +
            '<span class="text-sm">' + opt + '</span>' +
            (sel ? '<i class="fa-solid fa-check ml-auto" style="color:var(--accent)"></i>' : '') +
            '</button>';
    });
    h += '</div>';

    document.getElementById("qArea").innerHTML = h;
}

function goToSoal(index) {
    if (index >= 0 && index < S.qids.length) {
        S.qi = index;
        renderQ();
        window.scrollTo(0, 0);
    }
}

function selS(qid, i) {
    S.ans[qid] = i;
    S.done[qid] = true;
    S.isAnswered[qid] = true;
    renderQ();
    // Auto pindah ke soal berikutnya setelah menjawab
    if (S.qi < S.qids.length - 1) {
        setTimeout(function() { qNext(); }, 400);
    }
}

function qNext() {
    if (S.qi === S.qids.length - 1) { finishTryOut(); return; }
    S.qi++;
    renderQ();
    window.scrollTo(0, 0);
}
function qPrev() {
    if (S.qi > 0) { S.qi--; renderQ(); window.scrollTo(0, 0); }
}

function finishTryOut() {
    if (S.isFinished) return;
    S.isFinished = true;
    if (S.timer) {
        clearInterval(S.timer);
        S.timer = null;
    }

    var correct = 0, wrong = 0;
    S.qids.forEach(function(qid) {
        var q = QS.find(function(x) { return x.id === qid; });
        if (!q) return;
        var ua = S.ans[qid];
        var ok = false;
        if (ua === q.ans) ok = true;
        S.done[qid] = true;
        if (ok) { correct++; } else { 
            wrong++; 
            if (S.wrong.indexOf(qid) < 0) S.wrong.push(qid);
        }
    });

    S.wrong = uniq(S.wrong);

    var total = correct + wrong;
    var pct = total > 0 ? Math.round(correct / total * 100) : 0;
    document.getElementById("rPct").textContent = pct + "%";
    document.getElementById("rOk").textContent = correct;
    document.getElementById("rNo").textContent = wrong;
    document.getElementById("rTot").textContent = total;
    document.getElementById("rTime").textContent = "Waktu: " + getTimeSpent();

    var circ = 2 * Math.PI * 55;
    var ring = document.getElementById("rRing");
    ring.style.strokeDasharray = circ;
    ring.style.strokeDashoffset = circ - (circ * pct / 100);
    ring.style.stroke = pct >= 70 ? "var(--success)" : pct >= 40 ? "var(--accent)" : "var(--error)";

    var lbl = pct >= 90 ? "Luar Biasa! 🎉" : pct >= 75 ? "Bagus Sekali! 👏" : pct >= 55 ? "Cukup Baik 📚" : pct >= 35 ? "Perlu Belajar Lagi 💪" : "Jangan Menyerah! 🔥";
    document.getElementById("rLbl").textContent = lbl;
    document.getElementById("bRW").style.display = wrong > 0 ? "inline-flex" : "none";

    go("res");
    saveProgress();
}

function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function(x) { if (!seen[x]) { seen[x] = true; out.push(x); } });
    return out;
}

function reviewWrong() {
    var wqs = S.qids.filter(function(qid) { return S.wrong.indexOf(qid) >= 0; });
    if (wqs.length === 0) { toast("Tidak ada jawaban salah", "var(--success)"); return; }
    S.rqs = wqs.map(function(qid) { return QS.find(function(x) { return x.id === qid; }); }).filter(Boolean);
    S.ri = 0;
    go("rev");
    renderRev();
}

function renderRev() {
    var q = S.rqs[S.ri];
    if (!q) return;
    var total = S.rqs.length;
    document.getElementById("rvPr").style.visibility = S.ri > 0 ? "visible" : "hidden";
    document.getElementById("rvNx").innerHTML = S.ri === total - 1 ? "Kembali <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

    var ua = S.ans[q.id];
    var ok = ua === q.ans;

    var letters = "ABCDE";
    var h = '<div class="text-xs mb-2 font-semibold" style="color:var(--muted)">Soal ' + (S.ri + 1) + " / " + total + '</div>';
    if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
    h += '<h3 class="font-bold text-sm mb-4 leading-relaxed">' + q.q + '</h3>';
    h += '<div class="space-y-2.5">';

    q.opts.forEach(function(opt, i) {
        var cls = "off";
        if (i === q.ans) cls += " ok";
        else if (ua === i && i !== q.ans) cls += " no";
        h += '<button class="ob ' + cls + '">' +
            '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--border)") + ';color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--muted)") + '">' + letters[i] + '</span>' +
            '<span class="text-sm">' + opt + '</span>' +
            (i === q.ans ? '<i class="fa-solid fa-circle-check ml-auto" style="color:var(--success)"></i>' : '') +
            (ua === i && i !== q.ans ? '<i class="fa-solid fa-circle-xmark ml-auto" style="color:var(--error)"></i>' : '') +
            '</button>';
    });
    h += '</div>';
    h += '<div class="expbox ' + (ok ? 'good' : 'bad') + '">' +
        '<div class="flex items-center gap-2 mb-1.5 font-bold text-sm">' +
        '<i class="fa-solid ' + (ok ? 'fa-circle-check' : 'fa-circle-xmark') + '" style="color:' + (ok ? 'var(--success)' : 'var(--error)') + '"></i>' +
        (ok ? 'Jawaban Benar ✅' : 'Jawaban Salah ❌') +
        '</div>' +
        '<p style="color:var(--text);line-height:1.6;font-size:0.9rem;">' + q.exp + '</p>' +
        '</div>';

    document.getElementById("revA").innerHTML = h;
    window.scrollTo(0, 0);
}

function rvNav(dir) {
    if (dir === 1 && S.ri === S.rqs.length - 1) { backRev(); return; }
    S.ri = Math.max(0, Math.min(S.rqs.length - 1, S.ri + dir));
    renderRev();
}

function backRev() {
    go("res");
}

function retryTO() {
    startTryOut();
}

function saveProgress() {
    try {
        localStorage.setItem("tka_tryout4", JSON.stringify({
            done: Object.keys(S.done),
            wrong: S.wrong
        }));
    } catch(e) {}
}

function resetAll() {
    if (S.timer) {
        clearInterval(S.timer);
        S.timer = null;
    }
    S.done = {};
    S.wrong = [];
    S.ans = {};
    S.timeLeft = 5400;
    S.isFinished = false;
    S.isAnswered = {};
    updateTimerDisplay();
    document.getElementById("timerDisplay").classList.remove("warning");
    localStorage.removeItem("tka_tryout4");
    renderHome();
    toast("✅ Progress try out telah direset", "var(--success)");
}

function openExit() { document.getElementById("exMod").classList.add("open"); }
function closeMod() { document.getElementById("exMod").classList.remove("open"); }
function doExit() {
    closeMod();
    if (S.timer) {
        clearInterval(S.timer);
        S.timer = null;
    }
    go("home");
    renderHome();
}

function toast(msg, bg) {
    var t = document.getElementById("toast");
    t.style.display = "block";
    t.style.background = bg || "var(--card)";
    t.style.color = "#fff";
    t.textContent = msg;
    setTimeout(function() { t.style.display = "none"; }, 3000);
}

// INIT
// ================================================================
renderHome();
console.log("✅ Try Out 4 - 30 soal HOTS C4-C6 loaded");
console.log("📋 Level: C4 (10 soal), C5 (10 soal), C6 (10 soal)");
